<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站点已上线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    text-align: center;
    padding: 48px 40px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 16px;
    background: rgba(30, 41, 59, 0.6);
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #22c55e; margin: 0 auto 24px;
    box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.15);
  }
  h1 { font-size: 26px; font-weight: 600; margin-bottom: 16px; }
  p { font-size: 15px; line-height: 1.8; color: #94a3b8; }
  code {
    display: inline-block; margin-top: 20px; padding: 8px 14px;
    background: rgba(15, 23, 42, 0.8); border-radius: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #7dd3fc;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>发布通道已打通</h1>
    <p>
      这个网址已经可以在公网访问了。<br>
      当前是占位页面，正式网站内容正在等待上传。
    </p>
    <code>https://hutoar.github.io/my-site/</code>
  </div>
</body>
</html>
